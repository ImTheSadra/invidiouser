<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Invidiouser</title>
    <link rel="stylesheet" href="./popup.css">
</head>
<body>
<div class="popup-container">
    <div class="header">
        <h1>Invidiouser</h1>
        <div class="theme-toggle" id="themeToggle">🌓</div>
    </div>

    <div class="actions-row">
        <div class="option-card">
            <h4>Enable</h4>
            <label class="switch">
                <input type="checkbox" id="enableExtension">
                <span class="slider"></span>
            </label>
        </div>
        <div class="option-card" style="justify-content: center;">
            <button id="openInvidiousBtn" class="open-btn">🔗 Open Selected</button>
        </div>
    </div>

    <div class="manager-section">
        <div class="section-title">
            <span>📡 Managed Instances</span>
            <button id="clearAllUrls" class="clear-btn" style="font-size: 0.7rem;">🗑️ Clear all</button>
        </div>

        <div class="url-input-group">
            <input type="text" id="urlInput" placeholder="https://invidious.example.com" spellcheck="false">
            <button id="addUrlBtn" class="primary">➕ Add</button>
        </div>

        <div id="urlListContainer" class="url-list">
            <div class="empty-state">✨ Loading instances...</div>
        </div>
    </div>

    <div class="footer-icons">
        <a href="https://github.com/irdeako" target="_blank">
            <img id="deakoIcon" src="https://github.com/irdeako.png" alt="Deako" class="icon">
        </a>
        <img id="invidIcon" src="https://raw.githubusercontent.com/ImTheSadra/invidiouser/refs/heads/main/icon.png" alt="Invidious" class="icon" style="background: var(--accent); padding: 4px;">
    </div>

    <div id="alertMessage" class="alert">✅ Ready — manage Invidious instances</div>
</div>

<script src="./popup.js">
</script>
</body>
</html>
